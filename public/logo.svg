<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B45A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8893C"/>
    </linearGradient>
  </defs>

  <!-- "Educate" in Georgia serif, navy -->
  <text x="16" y="58" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" fill="#0D1B3E" letter-spacing="1.5">Educate</text>

  <!-- Gold rule -->
  <rect x="16" y="66" width="218" height="2.5" fill="url(#goldGrad)" rx="1"/>

  <!-- "ED" in bold serif, gold gradient -->
  <text x="16" y="104" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="url(#goldGrad)" letter-spacing="4">ED</text>

  <!-- Vertical divider -->
  <rect x="250" y="18" width="2" height="84" fill="#C9A84C" opacity="0.6"/>

  <!-- CANADA - increased font size even further -->
  <text x="264" y="44" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16" fill="#C9A84C" letter-spacing="4" text-anchor="start">CANADA</text>

  <!-- Thin gold rule -->
  <rect x="264" y="54" width="136" height="2" fill="#C9A84C" opacity="0.7"/>

  <!-- CURRICULUM ALIGNED - increased font size -->
  <text x="264" y="72" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="13" fill="#0D1B3E" letter-spacing="2" text-anchor="start">CURRICULUM ALIGNED</text>

  <!-- Thin gold rule -->
  <rect x="264" y="80" width="136" height="2" fill="#C9A84C" opacity="0.7"/>

  <!-- JK – GRADE 12 · BILINGUAL - increased font size -->
  <text x="264" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#0D1B3E" opacity="0.85" letter-spacing="1.5" text-anchor="start">JK – GRADE 12 · BILINGUAL</text>

  <!-- Maple / star mark -->
  <g transform="translate(390, 102) scale(0.65)" fill="#C9A84C" opacity="1">
    <path d="M0,-14 L2,-6 L8,-10 L6,-4 L14,-2 L8,2 L10,8 L4,6 L0,14 L-4,6 L-10,8 L-8,2 L-14,-2 L-6,-4 L-8,-10 L-2,-6 Z"/>
  </g>
</svg>
